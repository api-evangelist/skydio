apis:
- aid: skydio:skydio-cloud-api
  name: Skydio Cloud API
  description: >-
    The Skydio Cloud API is an HTTP-based REST API with JSON request and response bodies that lets developers
    manage Skydio drone fleets programmatically. It covers vehicles, docks, controllers, batteries, attachments,
    and sensor packages; mission templates, scheduled missions, mission control, and mission results;
    flights and telemetry (including live telemetry); media files, downloads, thumbnails, and scans; alerts
    and markers; users, external contacts, and distribution lists; webhooks, remote video, and media transfer;
    plus JWT/JWK validation and OpenAPI spec endpoints for administration.
  humanURL: https://apidocs.skydio.com/reference/introduction
  tags:
  - Drones
  - Fleet Management
  - Live Telemetry
  - Missions
  - REST API
  - Webhook
  tags_raw:
